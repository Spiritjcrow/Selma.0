<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Selma° Browser Companion</title>
<style>
body{font:14px system-ui;min-width:320px;padding:15px;background:#161727;color:#f4f4fb}
input,button{font:inherit;padding:9px;border-radius:6px}
input{width:95%;background:#22243d;color:white;border:1px solid #666}
button{cursor:pointer;margin:8px 4px 3px 0}
pre{white-space:pre-wrap;word-break:break-word;background:#292b43;padding:12px;border-radius:6px}
small{color:#c5c5d7}
</style></head>
<body>
<h2>Selma° local companion</h2>
<p><small>Read-only status. Nothing connects until you choose Connect.</small></p>
<label for="token">Gateway session token</label>
<input id="token" type="password" autocomplete="off" placeholder="Paste token from local terminal" />
<div>
  <button id="connect">Connect</button>
  <button id="refresh">Refresh status</button>
  <button id="disconnect">Disconnect</button>
</div>
<pre id="status" role="status" aria-live="polite">Disconnected</pre>
<script type="module" src="popup.js"></script>
</body></html>
