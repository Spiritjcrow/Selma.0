name: AudioMatrixEngine Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - 'audiomatrix/**'
  pull_request:
    branches: [main]
    paths:
      - 'AudioMatrixEngine/**'
      - '.github/workflows/audiomatrix-apk.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safely extract AudioMatrixEngine source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          with tarfile.open('AudioMatrixEngine/source-v0.2.tar.xz', 'r:xz') as package:
              members = package.getmembers()
              if sum(m.size for m in members if m.isfile()) > 150 * 1024 * 1024:
                  raise ValueError('Archive exceeds 150 MiB expanded source limit')
              for member in members:
                  path = PurePosixPath(member.name)
                  if (path.is_absolute() or '..' in path.parts or
                          not (member.isfile() or member.isdir()) or
                          'source-v0.2.tar.xz' in path.parts):
                      raise ValueError(f'Unsafe source archive entry: {member.name}')
              package.extractall(path='AudioMatrixEngine', filter='data')
          PY
          test -f AudioMatrixEngine/settings.gradle
          test -f AudioMatrixEngine/app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;25.2.9519653' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Host DSP tests
        working-directory: AudioMatrixEngine
        run: |
          bash scripts/test-dsp.sh
          bash scripts/test-native.sh
      - name: Build Android debug APK
        working-directory: AudioMatrixEngine
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioMatrixEngine-v0.2-debug-APK
          path: AudioMatrixEngine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
