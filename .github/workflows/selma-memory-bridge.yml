name: Selma Memory Bridge CI

on:
  pull_request:
    paths:
      - 'SELMA_MEMORY_BRIDGE_V1/**'
      - '.github/workflows/selma-memory-bridge.yml'
  push:
    paths:
      - 'SELMA_MEMORY_BRIDGE_V1/**'
      - '.github/workflows/selma-memory-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: SELMA_MEMORY_BRIDGE_V1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile memory_store.py import_export.py server.py
      - name: Run tests
        run: pytest -q
