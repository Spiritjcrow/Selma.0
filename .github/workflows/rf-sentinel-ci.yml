name: RF Sentinel Android verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/rf-sentinel/**"
      - ".github/workflows/rf-sentinel-ci.yml"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Portable metrics regression
        run: |
          cd apps/rf-sentinel
          python3 -m unittest discover -s tests -v
          test ! -e app/src/main/assets
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android gates and build debug APK
        working-directory: apps/rf-sentinel
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK contract
        working-directory: apps/rf-sentinel
        run: |
          set -o pipefail
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk \
            | tee app/build/outputs/apk/debug/rf-sentinel-debug-verification.json
      - name: Record APK SHA256
        working-directory: apps/rf-sentinel
        run: >-
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          > app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rf-sentinel-debug-NOT-DEVICE-TESTED
          path: |
            apps/rf-sentinel/app/build/outputs/apk/debug/app-debug.apk
            apps/rf-sentinel/app/build/outputs/apk/debug/app-debug.apk.sha256
            apps/rf-sentinel/app/build/outputs/apk/debug/rf-sentinel-debug-verification.json
          if-no-files-found: error
          retention-days: 7
