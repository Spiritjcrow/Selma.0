name: Selma Repo Health

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selma-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          find . -maxdepth 2 -type f -not -path './.git/*' | sort | sed -n '1,200p'
      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.py' -not -path './.git/*' -not -path '*/.venv/*' -not -path '*/venv/*')
          if ((${#files[@]})); then python3 -m py_compile "${files[@]}"; else echo 'No Python files'; fi
      - name: Test Hyperlogic procurement gate
        shell: bash
        run: |
          set -euo pipefail
          python3 SELMA0_ANDROID_AGENT_V1/tests/test_procurement_gate_v1.py
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*')
          if ((${#files[@]})); then for f in "${files[@]}"; do bash -n "$f"; done; else echo 'No shell files'; fi
      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          bad=[]
          for p in pathlib.Path('.').rglob('*.json'):
              if any(part in {'.git','node_modules','.venv','venv','build','dist'} for part in p.parts): continue
              try: json.loads(p.read_text(encoding='utf-8'))
              except Exception as e: bad.append(f'{p}: {e}')
          if bad: raise SystemExit('\n'.join(bad))
          print('JSON validation passed')
          PY
      - name: Run portable regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s SELMA0_ANDROID_AGENT_V1/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tools/generate_support_matrix.py --check
      - name: Build-entrypoint summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Selma repository health'
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Ref: $GITHUB_REF"
            for f in package.json pyproject.toml requirements.txt gradlew build.gradle build.gradle.kts settings.gradle settings.gradle.kts '*.sln' '*.csproj' Cargo.toml go.mod; do compgen -G "$f" >/dev/null && echo "- Detected: $f" || true; done
            echo '- Baseline checks: syntax, JSON, Hyperlogic procurement, command/device regressions, Gate 1 contracts, and generated support matrix.'
          } >> "$GITHUB_STEP_SUMMARY"
