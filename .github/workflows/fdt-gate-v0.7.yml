name: FDT Gate v0.7

on:
  push:
    paths:
      - 'FDT_GATE_V0_7/**'
      - '.github/workflows/fdt-gate-v0.7.yml'
  pull_request:
    paths:
      - 'FDT_GATE_V0_7/**'
      - '.github/workflows/fdt-gate-v0.7.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: FDT_GATE_V0_7
        run: python -m pip install .
      - name: Unit and conformance tests
        working-directory: FDT_GATE_V0_7
        run: python -m unittest discover -s tests -v
      - name: Operational demo
        working-directory: FDT_GATE_V0_7
        run: fdt-gate demo
