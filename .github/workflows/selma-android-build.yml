name: Selma Validation and Android Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - moto-g-play-2023-support
    paths:
      - .github/workflows/selma-android-build.yml
      - SELMA0_ANDROID_AGENT_V1/**
      - SELMA0_ANDROID_NATIVE_V1/**
  pull_request:
    paths:
      - .github/workflows/selma-android-build.yml
      - SELMA0_ANDROID_AGENT_V1/**
      - SELMA0_ANDROID_NATIVE_V1/**

permissions:
  contents: read

concurrency:
  group: selma-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-core:
    name: Validate Selma command core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q SELMA0_ANDROID_AGENT_V1
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s SELMA0_ANDROID_AGENT_V1/tests -p 'test_*.py' -v
      - name: Validate Termux scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find SELMA0_ANDROID_AGENT_V1 -type f -name '*.sh' -print0)

  native-android:
    name: Build Moto G Play 2023 Selma APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify VR/AR is not required
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'android\.hardware\.vr|daydream|cardboard|com\.google\.ar\.core|android\.hardware\.camera\.ar' SELMA0_ANDROID_NATIVE_V1/app/src/main SELMA0_ANDROID_NATIVE_V1/app/build.gradle
      - name: Assemble debug APK
        working-directory: SELMA0_ANDROID_NATIVE_V1
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Record APK checksum
        run: sha256sum SELMA0_ANDROID_NATIVE_V1/app/build/outputs/apk/debug/app-debug.apk > SELMA0_ANDROID_NATIVE_V1/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload Selma APK
        uses: actions/upload-artifact@v4
        with:
          name: Selma-v0.11.2-Moto-G-Play-2023-NoVR-debug
          path: |
            SELMA0_ANDROID_NATIVE_V1/app/build/outputs/apk/debug/app-debug.apk
            SELMA0_ANDROID_NATIVE_V1/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
