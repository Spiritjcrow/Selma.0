name: Selma Android Build
"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
      - selma-command-core-v1
    paths:
      - .github/workflows/selma-android-build.yml
      - SELMA0_ANDROID_AGENT_V1/**
  pull_request:
    paths:
      - .github/workflows/selma-android-build.yml
      - SELMA0_ANDROID_AGENT_V1/**

permissions:
  contents: read

jobs:
  command-core:
    name: Validate Selma command core
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/selma-command-core-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current revision
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile command-core sources
        run: python -m compileall -q SELMA0_ANDROID_AGENT_V1
      - name: Run command-core unit and regression tests
        run: python -m unittest discover -s SELMA0_ANDROID_AGENT_V1/tests -p 'test_*.py' -v

  build:
    name: Assemble Selma debug APK
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved Android branch
        uses: actions/checkout@v4
        with:
          ref: codex/selma-android-installable
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug-signed APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Selma-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
