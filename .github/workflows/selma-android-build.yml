name: Selma Android Build
# Retry after repository Actions permissions update
"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/selma-android-build.yml

permissions:
  contents: read

jobs:
  build:
    name: Assemble Selma debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved Android branch
        uses: actions/checkout@v4
        with:
          ref: codex/selma-android-installable
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.7
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug-signed APK
        working-directory: android
        shell: bash
        run: /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Selma-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
