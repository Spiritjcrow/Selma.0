[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fdt-gate"
version = "0.7.0"
description = "Flipp'n Da Table! deterministic agent action authorization runtime with WingDingynouse HARDSTONE security"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary prototype - project owner may relicense"}
authors = [{name = "Flipp'n Da Table! Project"}]
dependencies = ["cryptography>=43"]

[project.scripts]
fdt-gate = "fdt_gate.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdt_gate = ["canonical_registry.json"]
