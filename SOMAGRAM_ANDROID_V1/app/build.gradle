plugins { id 'com.android.application' }

android {
    namespace 'ai.selma.somagram'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.selma.somagram'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Prebuilt TDLib Android binary. Pin version; do not use '+'.
    implementation 'com.github.tdlibx:td:1.8.56'
}
