stages:
  - validate
  - test
  - evidence

default:
  interruptible: true

variables:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

python-compile:
  stage: validate
  image: python:3.12-slim
  script:
    - python3 -m compileall -q core adapters SELMA0_ANDROID_AGENT_V1 tests tools

gate1-and-runtime-tests:
  stage: test
  image: python:3.12-slim
  script:
    - python3 -m unittest discover -s SELMA0_ANDROID_AGENT_V1/tests -p 'test_*.py' -v
    - python3 -m unittest discover -s tests -p 'test_*.py' -v
    - python3 tools/generate_support_matrix.py --check

migration-evidence:
  stage: evidence
  image: python:3.12-slim
  script:
    - mkdir -p build/evidence
    - python3 tools/verify_gitlab_migration.py ci-evidence --output build/evidence/gitlab-ci-evidence.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/evidence/gitlab-ci-evidence.json
