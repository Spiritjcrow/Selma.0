# Manual-only native Android debug APK build.
# Uses macOS M2 so personal accounts can use their free macOS allocation.
# No release signing, publishing, destructive Git operations, or injected secrets.
workflows:
  selma-android-debug:
    name: SelmaOS Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Validate project layout and configure Android SDK path
        script: |
          set -eu
          PROJECT="$CM_BUILD_DIR/SELMA0_ANDROID_NATIVE_V1"
          test -f "$PROJECT/gradlew"
          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          test -d "$SDK_ROOT" || { echo "Android SDK directory not found: $SDK_ROOT" >&2; exit 1; }
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > "$PROJECT/local.properties"
      - name: Install required Android SDK platform
        script: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          PLATFORM_JAR="$SDK_ROOT/platforms/android-35/android.jar"
          BUILD_TOOL="$SDK_ROOT/build-tools/35.0.0/aapt2"
          if [ -s "$PLATFORM_JAR" ] && [ -x "$BUILD_TOOL" ]; then
            echo "Android SDK API 35 and Build Tools 35.0.0 already installed."
          else
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            test -x "$SDKMANAGER" || { echo "Android SDK Manager missing: $SDKMANAGER" >&2; exit 1; }
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -s "$PLATFORM_JAR"
          test -x "$BUILD_TOOL"
      - name: Lint, unit-test, and assemble debug APK
        script: |
          set -eu
          cd "$CM_BUILD_DIR/SELMA0_ANDROID_NATIVE_V1"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Confirm APK exists and generate SHA-256
        script: |
          set -eu
          APK="$CM_BUILD_DIR/SELMA0_ANDROID_NATIVE_V1/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          shasum -a 256 "$APK" > "${APK}.sha256"
      - name: Build and verify Selma Home
        script: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$KEY_DIR"' EXIT
          openssl rand -base64 36 | tr -d '\n' > "$KEY_DIR/pass"
          printf '\n' >> "$KEY_DIR/pass"
          keytool -genkeypair -storetype PKCS12 -keystore "$KEY_DIR/ci.p12" \
            -storepass:file "$KEY_DIR/pass" -keypass:file "$KEY_DIR/pass" -alias ci \
            -dname 'CN=Selma Home CI' -keyalg RSA -keysize 3072 -validity 1
          ANDROID_JAR="$SDK_ROOT/platforms/android-35/android.jar" \
          ANDROID_BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0" \
          SELMA_KEYSTORE="$KEY_DIR/ci.p12" SELMA_KEYPASS_FILE="$KEY_DIR/pass" \
          SELMA_APK_BASENAME=SelmaHome-0.4.0-ci-test \
            "$CM_BUILD_DIR/SELMAHOME_ANDROID_V040/build-host.sh" "$CM_BUILD_DIR/SELMAHOME_ANDROID_V040/build/codemagic"
          python3 "$CM_BUILD_DIR/tools/verify_selmahome_apk.py" \
            --apk "$CM_BUILD_DIR/SELMAHOME_ANDROID_V040/build/codemagic/SelmaHome-0.4.0-ci-test.apk" \
            --source "$CM_BUILD_DIR/SELMAHOME_ANDROID_V040" \
            --rebuilt-dex "$CM_BUILD_DIR/SELMAHOME_ANDROID_V040/build/codemagic/dex/classes.dex" \
            --apksigner "$SDK_ROOT/build-tools/35.0.0/apksigner" \
            --expected-package org.selma.home \
            --json-output "$CM_BUILD_DIR/SELMAHOME_ANDROID_V040/build/codemagic/verification.json"
          shasum -a 256 "$CM_BUILD_DIR/SELMAHOME_ANDROID_V040/build/codemagic/SelmaHome-0.4.0-ci-test.apk" > "$CM_BUILD_DIR/SELMAHOME_ANDROID_V040/build/codemagic/SelmaHome-0.4.0-ci-test.apk.sha256"
    artifacts:
      - SELMA0_ANDROID_NATIVE_V1/app/build/outputs/apk/debug/*.apk
      - SELMA0_ANDROID_NATIVE_V1/app/build/outputs/apk/debug/*.sha256
      - SELMA0_ANDROID_NATIVE_V1/app/build/reports/lint-results-debug.html
      - SELMAHOME_ANDROID_V040/build/codemagic/*.apk
      - SELMAHOME_ANDROID_V040/build/codemagic/*.sha256
      - SELMAHOME_ANDROID_V040/build/codemagic/verification.json
