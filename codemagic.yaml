# RF Sentinel only: manual, non-publishing verification on the isolated feature branch.
# Debug APK is NOT a release and does not establish physical-device QA.
workflows:
  rf_sentinel_android_debug:
    name: RF Sentinel Android debug verification
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events: []
    scripts:
      - name: Verify branch and source contracts
        script: |
          set -eu
          test "$CM_BRANCH" = "feature/rf-sentinel-android-ci-20261023"
          cd apps/rf-sentinel
          python3 -m unittest discover -s tests -v
          test ! -e app/src/main/assets
          ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
      - name: Install required SDK and check Gradle version
        script: |
          set -eu
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --version
          gradle --version | grep -qx 'Gradle 8.9'
      - name: Lint, unit tests, assemble debug APK
        script: |
          set -eu
          cd apps/rf-sentinel
          gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature, manifest and SHA-256
        script: |
          set -eu
          cd apps/rf-sentinel
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK" > app/build/outputs/apk/debug/rf-sentinel-debug-evidence.json
          sha256sum "$APK" > "$APK.sha256"
          sha256sum -c "$APK.sha256"
    artifacts:
      - apps/rf-sentinel/app/build/outputs/apk/debug/app-debug.apk
      - apps/rf-sentinel/app/build/outputs/apk/debug/app-debug.apk.sha256
      - apps/rf-sentinel/app/build/outputs/apk/debug/rf-sentinel-debug-evidence.json
