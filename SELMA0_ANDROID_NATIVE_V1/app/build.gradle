plugins { id 'com.android.application' }

android {
    namespace 'ai.selma.companion'
    compileSdk 36

    defaultConfig {
        applicationId 'ai.selma.companion'
        minSdk 26
        targetSdk 36
        versionCode 1000
        versionName '0.10.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
