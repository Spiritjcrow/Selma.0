[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selma-data-compiler"
version = "1.0.0"
description = "Canonical discovery, provenance, mapping, deduplication, merge, and needs analysis for Selma workspaces."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
selma-compile = "selma_data_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
